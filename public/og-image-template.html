<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 1200px;
      height: 630px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #F97316 0%, #DC2626 40%, #7C3AED 100%);
      overflow: hidden;
    }
    .container {
      text-align: center;
      padding: 60px;
      color: white;
      position: relative;
      z-index: 10;
    }
    .logo {
      font-size: 48px;
      font-weight: 900;
      margin-bottom: 40px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }
    .title {
      font-size: 64px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 30px;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.3);
    }
    .subtitle {
      font-size: 32px;
      font-weight: 600;
      opacity: 0.95;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.3);
    }
    .decoration {
      position: absolute;
      top: 50px;
      right: 50px;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.2), transparent);
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <div class="decoration"></div>
  <div class="container">
    <div class="logo">4Ability Hive</div>
    <div class="title">Transform Students Into<br>Industry-Ready Professionals</div>
    <div class="subtitle">Employability Training • Soft Skills • Placement Readiness</div>
  </div>
</body>
</html>
